<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f4f0" />
    <script>
      // Aplica o tema salvo antes da página aparecer, para não piscar.
      // (A mesma chave é usada em src/lib/useTheme.js.)
      try {
        var t = localStorage.getItem('isabela-portfolio-theme');
        if (['light', 'dark', 'pastel', 'auto'].indexOf(t) === -1) t = 'auto';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>Isabela Rodrigues Guimarães</title>
    <meta
      name="description"
      content="Portfólio de Isabela Rodrigues Guimarães — estudante de Direito e de Letras (Português–Grego), estagiária em Direito Tributário no Rio de Janeiro."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..600&family=DM+Sans:opsz,wght@9..40,300..600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
